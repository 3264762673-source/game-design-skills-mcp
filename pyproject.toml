[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "game-design-skills-mcp"
version = "0.3.0"
description = "Executable game design capabilities, browser effects, and evidence-aware skills over MCP"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "pydantic>=2.11,<3"]
readme = "README.md"

[project.scripts]
game-design-skills-mcp = "game_design_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["game_design_mcp"]
